<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: grim and candlelit, but quick and tactile, like cards slapped on an old table
IDEA: a tarot spread on oxblood felt; every card a printed bone-coloured plate
PICTURE: the battle board itself: drawn monsters, their intents, your hand at thumb height
COLOUR and TYPE: charcoal-oxblood ground, bone ink, ember red accent, moss teal for block; Cinzel + Alegreya Sans
LAYOUT: sticky run bar, board, player strip, hand, end turn; one column, built for a phone first */
:root{color-scheme:dark;--bg:#17100e;--ink:#efe4d2;--mute:#bba993;--ember:#ff5a36;--moss:#5fb3a1;--gold:#e8c86a;--hex:#b58ae0;--tox:#9bd36a;--card:#f3e9d7;--cardink:#2a1a14}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Alegreya Sans',system-ui,sans-serif;overflow-x:clip}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#3d201a 0%,#1f1311 55%,#110b0a 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:Cinzel,serif;line-height:1.05;margin:0;text-wrap:balance;font-weight:800}
#app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px 14px;padding:8px 14px;flex-wrap:wrap;position:sticky;top:0;background:#140c0bdd;backdrop-filter:blur(6px);border-bottom:1px solid #ffffff14;z-index:5}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;white-space:nowrap}
.party-hud{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;padding:6px 14px;background:#241815;font-size:.85rem}.party-hud strong,.party-hud .acting{color:var(--gold)}
.stat.hp{color:#ff8a6e}.stat.gd{color:var(--gold)}
.relics{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.rel{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle at 35% 30%,#4a3218,#1d140c);color:var(--gold);font:800 14px Cinzel,serif;display:inline-grid;place-items:center;padding:0;flex:none}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid #ffffff30;background:#2d1b17;font-weight:800}
.btn:hover:not(:disabled){border-color:#ffffff66}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#1a0d09}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:0 12px}
/* title */
.title{display:flex;flex-direction:column;min-height:100vh}
.title .hero{width:100%;height:64vh;min-height:320px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(to bottom,#0008 0%,transparent 28%,transparent 52%,#17100ecc 82%,var(--bg) 100%),url(assets/bg_gate.webp) 50% 58%/cover}
.tmark{text-align:center;padding:0 16px clamp(18px,5vh,56px);animation:rise-in 1.2s ease-out both}
.tmark h1{font-size:clamp(50px,12vw,112px);letter-spacing:.02em;background:linear-gradient(#fff6de 10%,#e8c86a 55%,#a8742a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px #000d) drop-shadow(0 0 28px #a46bff66)}
.kick{margin:8px 0 0;font:800 clamp(13px,1.6vw,17px) Cinzel,serif;letter-spacing:.16em;color:#ece2ff;text-shadow:0 2px 8px #000}
@keyframes rise-in{from{opacity:0;transform:translateY(16px)}}
.hi .title .hero{background-image:linear-gradient(to bottom,#0008 0%,transparent 28%,transparent 52%,#17100ecc 82%,var(--bg) 100%),url(assets/bg_gate_4k.webp)}
.tbody{padding:4px max(5vw,18px) 40px;max-width:720px;margin:0 auto;width:100%;text-align:center}
.tbody .how{text-align:left}
.title h1{font-size:clamp(40px,10vw,64px)}
.lede{font-size:17px;color:var(--mute);max-width:52ch;margin:0 auto 20px}
.how{margin-top:26px;border-top:1px solid #ffffff1a;padding-top:6px}
.how summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.how li{margin:7px 0;color:var(--mute)}
.emb{animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
/* map */
.mapv{padding:14px 12px 34px}
.maphead{text-align:center}.maphead h2{font-size:30px}.maphead p{color:var(--mute);margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:13px;color:var(--mute);margin:10px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.map{display:block;width:100%;max-width:440px;margin:0 auto;background:radial-gradient(90% 60% at 50% 40%,#2c1814,#1a100e);border-radius:20px;border:1px solid #ffffff12}
.map line{stroke:#ffffff2a;stroke-width:2.5;stroke-dasharray:3 6;stroke-linecap:round}
.map line.on{stroke:var(--gold);stroke-dasharray:none;stroke-width:3}
.node .hit{fill:transparent}.node .c{fill:#2d1b17;stroke:#ffffff45;stroke-width:2}
.node.can{cursor:pointer}.node.can .c{fill:#4e2219;stroke:var(--ember);stroke-width:3;animation:pulse 1.3s ease-in-out infinite}
.node.vis .c{fill:#5a3a2c;stroke:var(--gold)}.node.dim{opacity:.32}
.node.boss .c{fill:#2a1416;stroke:var(--gold);stroke-width:3}
@keyframes pulse{50%{stroke-width:6}}
/* combat stage */
.stage{position:relative;height:clamp(318px,46vh,440px);overflow:hidden;border-bottom:1px solid #ffffff14;isolation:isolate}
.stage>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.stage{background:#140c0b;perspective:900px;perspective-origin:50% 45%}
.L{position:absolute;inset:0;pointer-events:none}
.bgL{inset:-7%;z-index:-3;transform:translateZ(-600px) scale(1.667)}.bgL>.bgimg{position:absolute;inset:0;width:100%;height:100%}
.midL{z-index:-2;transform:translateZ(-220px) scale(1.244)}
.fgL{z-index:3;transform:translateZ(160px) scale(.822)}
.amb{position:absolute;z-index:-1;pointer-events:none;translate:-50% -50%;mix-blend-mode:screen;animation-duration:26s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.amb.leaf{mix-blend-mode:normal;z-index:2;animation-duration:11s;animation-timing-function:linear;animation-direction:normal;filter:brightness(.85) drop-shadow(0 4px 4px #0006)}
@keyframes drift{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
@keyframes drift2{from{transform:translateX(6%) scale(1.05)}to{transform:translateX(-8%)}}
@keyframes pulse{from{opacity:calc(var(--o)*.5)}to{opacity:var(--o)}}
@keyframes pulse2{0%,100%{opacity:calc(var(--o)*.6)}50%{opacity:var(--o)}}
@keyframes float{from{transform:translateY(6px)}to{transform:translateY(-12px) scale(1.04)}}
@keyframes float2{from{transform:translate(-4%,4px) rotate(-4deg)}to{transform:translate(5%,-10px) rotate(4deg)}}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(-6%,-8%)}50%{transform:translate(4%,-14%)}75%{transform:translate(8%,-4%)}100%{transform:translate(0,-10%)}}
@keyframes rain{from{transform:translateY(-6%);opacity:calc(var(--o)*.7)}to{transform:translateY(6%);opacity:var(--o)}}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(-60px,420px) rotate(540deg)}}
@keyframes fall2{from{transform:translate(0,0) rotate(40deg)}to{transform:translate(50px,430px) rotate(-420deg)}}
@keyframes fall3{from{transform:translate(0,0) rotate(-20deg)}to{transform:translate(-30px,410px) rotate(380deg)}}
.amb[style*="rain"]{animation-duration:1.4s;animation-timing-function:linear}
.amb[style*="flutter"]{animation-duration:9s}
.bolt{position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(80% 60% at 60% 10%,#d8c8ff,#6b4aa8 40%,transparent 75%);opacity:0;animation:bolt 11s linear infinite}
@keyframes bolt{0%,91%,100%{opacity:0}92%{opacity:.55}93%{opacity:.08}94.5%{opacity:.4}96%{opacity:0}}
.pt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pt-g{z-index:-1;mix-blend-mode:screen}.pt-l{z-index:2}
.vfx{position:fixed;pointer-events:none;z-index:44;translate:-50% -50%;mix-blend-mode:screen;opacity:0}
.prop{position:absolute;width:auto;transform:translateX(-50%)}
.midL .prop{filter:brightness(.78) saturate(.85) drop-shadow(0 6px 6px #0008)}
.fgL .prop{filter:brightness(.68) saturate(.9) blur(.8px) drop-shadow(0 10px 14px #000c)}
.info,.hint{position:relative;z-index:4}.hint{position:absolute}
.bgimg{object-fit:cover;object-position:50% 74%;transform-origin:50% 80%;animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09) translateX(-1.5%)}}
.shade{background:radial-gradient(120% 90% at 50% 40%,transparent 55%,#0009 100%),linear-gradient(to bottom,#0005 0%,transparent 22%,transparent 62%,#000a 100%)}
.stage.quake{animation:quake .4s}
@keyframes quake{15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}50%{transform:translate(-5px,3px)}70%{transform:translate(3px,-2px)}}
.hint{position:absolute;top:10px;left:0;right:0;text-align:center;margin:0;font:800 15px Cinzel,serif;text-shadow:0 2px 8px #000}
.actors{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:0 10px 0 24px}
.foes{display:flex;gap:2px;align-items:flex-end;justify-content:flex-end}
.unit{width:120px;border:0;background:none;padding:2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:inherit}
.unit.big{width:160px}
.spr{display:block;width:114px;height:95px;position:relative}
.unit.big .spr{width:156px;height:130px}
.spr>svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 8px #000b)}
.foes .unit.pw{width:calc(var(--w)*1px + 8px)}.foes .unit.pw .spr.paint{width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.rg{position:absolute;inset:0;display:block;transform-origin:50% 100%;filter:drop-shadow(0 6px 8px #000b)}
.rp{position:absolute;display:block;height:auto;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}.rgp{position:absolute;inset:0;display:block;pointer-events:none}
.rp,.rgp{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}.a-breathe{animation-name:rBreathe;animation-duration:2.4s}@keyframes rBreathe{from{translate:0 0}to{translate:0 1.3%}}
.a-sway{animation-name:rSway;animation-duration:2.9s}.a-sway2{animation-name:rSway2;animation-duration:3.4s}
.a-nod{animation-name:rNod;animation-duration:2.6s}.a-claw{animation-name:rClaw;animation-duration:2.2s}.a-claw2{animation-name:rClaw2;animation-duration:2.5s}
.a-leg{animation-name:rLeg;animation-duration:1.9s}.a-leg2{animation-name:rLeg2;animation-duration:2.1s}.a-chew{animation-name:rChew;animation-duration:.9s}
.a-cap{animation-name:rCap;animation-duration:2.6s}.a-glow{animation-name:rGlow;animation-duration:1.4s}.a-pulse{animation-name:rPulse;animation-duration:1.8s}
.a-hover{animation-name:rHover;animation-duration:3.2s}.a-flick{animation-name:rFlick;animation-duration:1.1s}.a-flick2{animation-name:rFlick;animation-duration:1.4s}
.a-drift{animation-name:rDrift;animation-duration:3.6s}.a-drift2{animation-name:rDrift2;animation-duration:4.2s}.a-drift3{animation-name:rDrift;animation-duration:5s}
@keyframes rSway{from{rotate:-3deg}to{rotate:3deg}}@keyframes rSway2{from{rotate:2.5deg}to{rotate:-3.5deg}}
@keyframes rNod{from{rotate:-2deg}to{rotate:2.5deg}}@keyframes rClaw{from{rotate:-3deg}to{rotate:4deg}}@keyframes rClaw2{from{rotate:3deg}to{rotate:-3deg}}
@keyframes rLeg{from{rotate:-2deg}to{rotate:2deg}}@keyframes rLeg2{from{rotate:2deg}to{rotate:-2deg}}@keyframes rChew{from{rotate:-6deg}to{rotate:5deg}}
@keyframes rCap{from{rotate:-2deg;filter:brightness(.95)}to{rotate:2.5deg;filter:brightness(1.2)}}@keyframes rGlow{from{filter:brightness(.95)}to{filter:brightness(1.3) saturate(1.2)}}
@keyframes rPulse{from{scale:1;filter:brightness(.95)}to{scale:1.025;filter:brightness(1.25)}}
@keyframes rHover{from{translate:0 2%;rotate:-2deg}to{translate:0 -3%;rotate:2deg}}
@keyframes rFlick{from{scale:.92 1;opacity:.75}to{scale:1.06 1.1;opacity:1}}
@keyframes rDrift{from{translate:0 0;rotate:-8deg}to{translate:0 -18%;rotate:10deg}}@keyframes rDrift2{from{translate:0 -12%;rotate:6deg}to{translate:0 6%;rotate:-9deg}}
.spr.outL .a-claw,.spr.outL .a-claw2{animation:rStrike .3s ease-out}.spr.outL .a-chew{animation:rChomp .25s ease-out}.spr.outL .a-flick,.spr.outL .a-flick2{animation:rFlare .4s}
@keyframes rStrike{0%{rotate:0deg}45%{rotate:9deg}100%{rotate:-7deg}}@keyframes rChomp{0%,100%{rotate:0deg}50%{rotate:-18deg}}
.spr.oc .a-cap,.spr.oc .a-glow,.spr.oc .a-pulse,.spr.oc .a-flick,.spr.oc .a-flick2,.spr.oc .a-hover{animation:rFlare .45s}
@keyframes rFlare{0%{filter:none}40%{filter:brightness(2.2) saturate(1.4) drop-shadow(0 0 12px #ffd27a)}100%{filter:none}}
.spr.paint>img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;filter:drop-shadow(0 6px 8px #000b);-webkit-user-drag:none;user-select:none}
.bob{animation:bob 2.6s ease-in-out infinite}.bob.fly{animation-name:fly}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.02)}}
@keyframes fly{50%{transform:translateY(-10px)}}
.spr.outR{animation:outR .11s ease-in forwards}@keyframes outR{to{transform:translateX(42px)}}
.spr.retR{animation:retR .28s ease-out}@keyframes retR{from{transform:translateX(42px)}}
.spr.outL{animation:outL .11s ease-in forwards}@keyframes outL{to{transform:translateX(-42px)}}
.spr.retL{animation:retL .28s ease-out}@keyframes retL{from{transform:translateX(-42px)}}
.spr.hitR{animation:hitR .34s}@keyframes hitR{0%{filter:brightness(4) saturate(0)}30%{transform:translateX(12px)}100%{filter:none;transform:none}}
.spr.hitL{animation:hitL .34s}@keyframes hitL{0%{filter:brightness(4) saturate(0)}30%{transform:translateX(-12px)}100%{filter:none;transform:none}}
.unit.tgt{cursor:crosshair}
.unit.tgt .spr::after{content:'';position:absolute;left:12%;right:12%;bottom:-3px;height:12px;border-radius:50%;box-shadow:0 0 0 2px var(--ember),0 0 18px var(--ember);animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{opacity:.45}}
.hero.guard .spr::before{content:'';position:absolute;inset:-4px 8px 0;border-radius:50% 50% 42% 42%;background:radial-gradient(closest-side,transparent 62%,#5fb3a150);box-shadow:inset 0 0 0 2px #5fb3a170}
.unit.dying{animation:die .8s forwards;pointer-events:none}
@keyframes die{to{opacity:0;filter:blur(4px) sepia(1) brightness(1.8);transform:translateY(-16px) scale(.88)}}
.unit.dead{visibility:hidden;pointer-events:none}
.info{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;background:#000000a0;border-radius:9px;padding:3px 6px 4px}
.fn{font:800 12.5px Cinzel,serif;text-align:center;line-height:1.1}
.ints{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:26px}.irow{display:flex;gap:4px}.iname{font:700 11px Cinzel,serif;letter-spacing:.04em;color:#f3e2c0;text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap}
.it{display:inline-flex;gap:3px;align-items:center;font-weight:800;padding:2px 8px;border-radius:8px;font-size:15px;white-space:nowrap;background:#000a}
.it.a{color:#ff9a80;box-shadow:inset 0 0 0 1.5px #ff5a3699}.it.b{color:#8fe0cf;box-shadow:inset 0 0 0 1.5px #5fb3a199}.it.u{color:var(--gold);box-shadow:inset 0 0 0 1.5px #e8c86a99}.it.d{color:#d2b6f2;box-shadow:inset 0 0 0 1.5px #b58ae099}
.bar{display:block;width:100%;height:9px;border-radius:6px;background:#0009;overflow:hidden;position:relative}
.bar .pv{position:absolute;top:0;bottom:0;background:#ffe3a3;box-shadow:0 0 8px #ffd27a;animation:pvb .55s ease-in-out infinite alternate}
@keyframes pvb{from{opacity:.45}to{opacity:1}}
.pvn{font-weight:800;color:#ffd27a;margin-left:4px;animation:pvb .55s ease-in-out infinite alternate}.pvn.b{color:#8fe0cf}
.unit.lethal .info{box-shadow:0 0 0 2px #ff5a36,0 0 16px #ff5a36aa}.unit.lethal .pvn{color:#ff8a6e}
.ds b.up{color:#2f8a3e}.ds b.dn{color:#c0392b}
.bar i{display:block;height:100%;background:linear-gradient(#ff7a58,#c8371c);transition:width .3s}
.hpt{font-size:13px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.chips:empty{display:none}
.chip{font-size:13px;font-weight:800;padding:1px 6px;border-radius:7px;background:#0007;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.chip.blk,.chip.b{background:var(--moss);color:#0c201c}.chip.u{background:#e8c86a2e;color:var(--gold)}.chip.d{background:#b58ae02e;color:#d2b6f2}.chip.p{background:#9bd36a2e;color:var(--tox)}
.hand{--hand-card-width:148px;--hand-card-height:212px;position:relative;height:calc(var(--hand-card-height) + 66px);margin-top:2px}
.hand .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);margin:0}
.hand .card{position:absolute;top:22px;width:var(--hand-card-width);height:var(--hand-card-height);
 --step:min(calc(var(--hand-card-width) + 10px),calc((100% - var(--hand-card-width) - 68px) / var(--gaps)));
 left:calc(50% - var(--hand-card-width) / 2 + var(--offset) * var(--step));transform-origin:50% 130%;transform:translateY(var(--y)) rotate(var(--r));transition:transform .18s ease-out}
.hand .card.sel{transform:translateY(-32px) rotate(0) scale(1.07);z-index:40!important;box-shadow:0 0 0 3px var(--gold),0 16px 26px #000d}
@keyframes deal{from{transform:translate(-170px,70px) rotate(-28deg);opacity:0}}
.ctl{display:flex;align-items:center;gap:12px;padding:4px 14px 16px}
.ctl .piles{flex:1;line-height:1.3}
.orb{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb391,var(--ember) 55%,#7a1d0c);color:#1a0d09;display:grid;place-items:center;align-content:center;flex:none;box-shadow:0 0 22px #ff5a3677,inset 0 -4px 8px #0005;font-family:Cinzel,serif;line-height:1}
.orb b{font-size:25px}.orb small{font-size:12px;font-weight:800}
.piles{font-size:14px;color:var(--mute)}
#aim{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35;display:none;overflow:visible;color:var(--ember);filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 2px 2px #000)}
#aim g path{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}#aim g path.head{fill:currentColor;stroke-width:2}
.unit.aimed .spr::after{content:'';position:absolute;left:8%;right:8%;bottom:-4px;height:14px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 0 26px var(--gold);animation:none}
.unit.aimed .info{box-shadow:0 0 0 2px var(--gold)}
.hand,.stage{-webkit-user-select:none;user-select:none}.hand .card{touch-action:none}
.hand .card.lifted{visibility:hidden}
.card.dragcard{position:fixed;margin:0;z-index:46;pointer-events:none;transition:box-shadow .15s;transform-origin:50% 50%}
.card.dragcard.ready{box-shadow:0 0 0 3px var(--gold),0 0 30px #e8c86aaa,0 18px 30px #000c!important}
.stage{transition:box-shadow .2s}.stage.drop{box-shadow:inset 0 0 0 2px #e8c86a77,inset 0 -40px 80px #e8c86a26}
.hero{width:150px}.hero .spr{width:150px;height:226px}
.rig{position:absolute;left:-22%;top:0;width:144%;height:100%;filter:drop-shadow(0 8px 10px #000c)}
.rigimg{position:absolute;bottom:0;left:50%;height:96%;transform:translateX(-50%);filter:drop-shadow(0 8px 10px #000c)}
.gshadow{position:absolute;left:14%;right:10%;bottom:-3px;height:10px;border-radius:50%;background:radial-gradient(closest-side,#000a,transparent)}
.card.ghost{position:fixed;margin:0;z-index:45;pointer-events:none;transition:none}
.spark{position:fixed;width:7px;height:7px;margin:-3px;border-radius:50%;background:#ffb36b;box-shadow:0 0 10px var(--ember);pointer-events:none;z-index:45}
.banner{position:fixed;left:0;right:0;top:30%;z-index:40;text-align:center;pointer-events:none;animation:ban 2.1s forwards;background:linear-gradient(90deg,transparent,#000d 18%,#000d 82%,transparent);padding:16px 0 18px}

async function resolveCh(s,c){
 if(s.k.startsWith('neutral'))return resolveNeutralChoice(s,c);
 if(s.k=='yes'){if(s.ok&&!s.ok())return false;return (await chooseP(name(c),s.q,['Yes','No']))===0}
 let list=[],title=s.q||'';
 if(s.k=='offer')list=offerable();
 else if(s.k=='recall'){list=recallable(s.t);title='Recall a '+(s.t?TN[s.t]:'card')+' from your Sanctum'}
 else if(s.k=='restore'){list=restorable();title='Restore an Exhausted card to its Sanctum'}
 else if(s.k=='hand')list=handChoices(c,s.sc);

// Match unchanged words in order so multiple independent edits stay legible.
function markSmithChanges(before,after){
 const tokens=el=>el.textContent.match(/\s+|[\p{L}\p{N}]+|[^\s]/gu)||[];
 const a=tokens(before),b=tokens(after);
 const matches=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)
  matches[i][j]=a[i]===b[j]?1+matches[i+1][j+1]:Math.max(matches[i+1][j],matches[i][j+1]);
 const keptA=new Set(),keptB=new Set();
 for(let i=0,j=0;i<a.length&&j<b.length;){
  if(a[i]===b[j]){keptA.add(i++);keptB.add(j++)}
  else if(matches[i+1][j]>=matches[i][j+1])i++;else j++;
 }
 function paint(el,words,kept){el.replaceChildren(...words.map((word,i)=>{
  if(kept.has(i)||!word.trim())return word;
  const mark=document.createElement('mark');mark.textContent=word;return mark;
 }))}
 if(keptA.size!==a.length||keptB.size!==b.length){paint(before,a,keptA);paint(after,b,keptB)}
}

function setPreview(ci,ti,cardEl){const key=ci<0?'':ci+':'+ti;if(key===PV.key)return;PV.key=key;clearPreview();const c=C&&C.hand[ci];
 PT=ti!=null&&ti!=='all'&&C?C.foes[ti]:null;
 const el=cardEl||$(`.hand .card[data-v="${ci}"]`);if(c&&el){showDrawForecast(c);const ds=el.querySelector('.ds');if(ds)ds.innerHTML='<span>'+keywordText(KD(c).d(c.up,c))+'</span>'}
 if(!c||ti==null){PT=null;return}
 const r=simCard(c,ti==='all'?null:ti);PT=null;if(!r)return;
 r.loss.forEach((l,i)=>{const f=C.foes[i],u=$('#f'+i);if(!l||!u||f.hp<=0)return;const nh=f.hp-l,bar=u.querySelector('.bar'),hp=u.querySelector('.hpt');
  if(bar)bar.insertAdjacentHTML('beforeend',`<i class="pv" style="left:${nh/f.max*100}%;width:${l/f.max*100}%"></i>`);
  if(hp)hp.insertAdjacentHTML('beforeend',`<span class="pvn">${nh<=0?'Lethal':'-'+l}</span>`);if(nh<=0)u.classList.add('lethal')});
 if(r.blk>0){const hp=$('#hero .hpt');if(hp)hp.insertAdjacentHTML('beforeend',`<span class="pvn b">+${r.blk}</span>`)}}

/* ---------- targeting arrow ---------- */
let AP={x:0,y:0,moved:false},aimOn=false,drag=null,ignoreClick=-Infinity;
const liveFoe='.unit[data-a=foe]:not(.dead):not(.dying)';
function aimTick(){const svg=$('#aim'),on=screen=='combat'&&C&&C.sel>=0&&!C.busy&&!C.lock;
 if(!on){svg.style.display='none';document.querySelectorAll('.unit.aimed').forEach(u=>u.classList.remove('aimed'));if(PV.key&&!(drag&&drag.g))setPreview(-1);aimOn=false;return}
 const card=$('.hand .card.sel');if(!card){svg.style.display='none';return requestAnimationFrame(aimTick)}
 svg.style.display='block';const cr=card.getBoundingClientRect(),sx=cr.left+cr.width/2,sy=cr.top+10;
 let over=null;if(AP.moved){const el=document.elementFromPoint(AP.x,AP.y);over=el&&el.closest(liveFoe)}else over=$(liveFoe);
 document.querySelectorAll('.unit.aimed').forEach(u=>{if(u!==over)u.classList.remove('aimed')});if(over)over.classList.add('aimed');
 setPreview(C.sel,over?+over.dataset.v:null);
 let ex=AP.x,ey=AP.y;if(over){const r=over.querySelector('.spr').getBoundingClientRect();ex=r.left+r.width/2;ey=r.top+r.height*.45}
 const qx=sx+(ex-sx)*.1,qy=Math.min(sy,ey)-Math.max(70,Math.abs(ex-sx)*.4);
 const P=$('#aimP');P.setAttribute('d',`M${sx} ${sy}Q${qx} ${qy} ${ex} ${ey}`);const L=P.getTotalLength(),gap=24*Z,ph=RM?0:(performance.now()/24)%gap;let h='';
 for(let d=ph;d<L-30;d+=gap){const p=P.getPointAtLength(d),q=P.getPointAtLength(Math.min(L,d+1)),a=Math.atan2(q.y-p.y,q.x-p.x)*57.2958,sc=(.55+.55*d/L)*Z;h+=`<path d="M-5-6L3 0L-5 6" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${sc.toFixed(2)})"/>`}
 if(L>4){const p=P.getPointAtLength(L),q=P.getPointAtLength(L-3),a=Math.atan2(p.y-q.y,p.x-q.x)*57.2958;h+=`<path class="head" d="M-15-13L7 0L-15 13L-9 0Z" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${(over?1.2:1)*Z})"/>`}
 svg.style.color=over?'var(--gold)':'var(--ember)';$('#aimG').innerHTML=h;requestAnimationFrame(aimTick)}
document.addEventListener('pointerdown',e=>{AP.x=e.clientX;AP.y=e.clientY;const b=e.target.closest('.hand .card[data-a=card]');if(!b||!C||C.busy||C.lock)return;const i=+b.dataset.v,c=C.hand[i];if(!c||!playable(c))return;drag={i,x:e.clientX,y:e.clientY,active:false,tg:!!KD(c).tg,el:b,lx:e.clientX,tilt:0}});
function dragMove(){const d=drag;if(!d||!d.g)return;const vx=AP.x-d.lx;d.lx=AP.x;d.tilt=Math.max(-14,Math.min(14,d.tilt*.8+vx*.9));d.g.style.left=(AP.x-d.ox)/Z+'px';d.g.style.top=(AP.y-d.oy)/Z+'px';d.g.style.transform=`scale(1.08) rotate(${d.tilt.toFixed(1)}deg)`;
 const h=$('.hand'),ready=!!h&&AP.y<h.getBoundingClientRect().top+16;d.ready=ready;d.g.classList.toggle('ready',ready);setPreview(ready?d.i:-1,ready?'all':null,d.g);const st=$('.stage');if(st)st.classList.toggle('drop',ready);const hi=$('.hint');if(hi)hi.textContent=ready?'Release to play':'Drag up to play'}
function endFree(){showDrawForecast(null);const st=$('.stage');if(st)st.classList.remove('drop');setPreview(-1)}
document.addEventListener('pointermove',e=>{AP.x=e.clientX;AP.y=e.clientY;if(C&&C.sel>=0)AP.moved=true;
 if(drag&&!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12){drag.active=true;if(!C||C.busy||C.lock){drag=null;return}
  if(drag.tg){C.sel=drag.i;AP.moved=true;render()}
  else{if(C.sel>=0){C.sel=-1;render();drag.el=$(`.hand .card[data-v="${drag.i}"]`)}const b=drag.el,r=b.getBoundingClientRect(),g=b.cloneNode(true);g.removeAttribute('data-a');g.classList.add('dragcard');g.classList.remove('sel');g.style.cssText=`zoom:${Z};left:${r.left/Z}px;top:${r.top/Z}px;width:${r.width/Z}px;height:${r.height/Z}px;animation:none`;drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;document.body.appendChild(g);drag.g=g;b.classList.add('lifted')}}
 if(drag&&drag.g)dragMove()},{passive:true});
document.addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d||!d.active||!C)return;ignoreClick=performance.now();
 if(!d.tg){endFree();const g=d.g;if(!g)return;
  if(d.ready&&!C.busy&&!C.lock&&C.hand[d.i]&&playable(C.hand[d.i])){play(d.i,null,g);g.remove();return}
  const hint=$('.hint');if(hint)hint.textContent='Your turn '+C.turn;const r=d.el.getBoundingClientRect(),gr=g.getBoundingClientRect();
  const fin=()=>{g.remove();d.el.classList.remove('lifted')};if(RM)return fin();
  g.animate([{transform:g.style.transform},{transform:`translate(${(r.left-gr.left)/Z}px,${(r.top-gr.top)/Z}px) scale(1) rotate(0)`}],{duration:180,easing:'ease-out'}).onfinish=fin;return}
 if(C.busy||C.lock)return;const el=document.elementFromPoint(e.clientX,e.clientY),u=el&&el.closest(liveFoe);if(u&&C.sel>=0){const f=C.foes[+u.dataset.v];if(f&&f.hp>0)return play(C.sel,f)}C.sel=-1;AP.moved=false;render()});
document.addEventListener('pointercancel',()=>{if(drag&&drag.g){drag.g.remove();drag.el.classList.remove('lifted');endFree()}drag=null});
setZoom();let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{setZoom();if(screen=='combat'&&C&&!C.busy&&!C.lock)render()},150)});
if (new URLSearchParams(location.search).get('gallery') === '1') {
  screen = 'gallery';
  import('./tools/reference-gallery.mjs').then(({mountGallery}) => mountGallery($('#app'), {
    cards:K, forms:FK, relics:RELICS, gods:GODS, statuses:STN, statusArt, oathArt,
    cardArt, relicIcon, hudIcon, definition:KD, cost, types:TN
  })).catch(error => { $('#app').textContent = 'Gallery could not load: ' + error.message; });
} else render();
if (combatLab && screen !== "gallery") {
  import('./tools/combat-lab.mjs').then(({mountLab}) => {
    const encounters = [
      ...[...EASY, ...HARD].map(keys => ({keys, kind:'fight'})),
      ...ELITE.map(keys => ({keys, kind:'elite'})),
      {keys:['king'], kind:'boss'}
    ];
    mountLab({
      heroes:HEROES, gods:GODS, enemies:EN, encounters,
      start(hero, oath, floor, encounter) {
        newRun(hero);
        delete G.threshold;
        G.floor = floor;
        G.pos = {f:floor - 1, l:0};
        G.path = Array.from({length:floor}, (_, f) => [f, 0]);
        G.map[floor - 1][0].t = encounter.kind;
        G.oaths = oath ? [oath] : [];
        startCombat(encounter.keys, encounter.kind);
      },
      mechanics:{
        cardInfo:card => ({uid:card.u, id:card.id, name:name(card), cost:cost(card),
          playable:playable(card), targeted:Boolean(KD(card).tg)}),
        playCard:(uid, target) => play(C.hand.findIndex(card => card.u === uid), C.foes[target]),
        endTurn,
        choose:(action, value) => A[action](value)
      },
      snapshot:() => ({url:location.href, screen, run:G, combat:C})
    });
  }).catch(error => {
    const message = document.createElement('p');
    message.textContent = 'Combat Lab could not start: ' + error.message;
    document.body.prepend(message);
  });
}
})();
