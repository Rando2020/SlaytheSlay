<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: grim and candlelit, but quick and tactile, like cards slapped on an old table
IDEA: a tarot spread on oxblood felt; every card a printed bone-coloured plate
PICTURE: the battle board itself: drawn monsters, their intents, your hand at thumb height
COLOUR and TYPE: charcoal-oxblood ground, bone ink, ember red accent, moss teal for block; Cinzel + Alegreya Sans
LAYOUT: sticky run bar, board, player strip, hand, end turn; one column, built for a phone first */
:root{color-scheme:dark;--bg:#17100e;--ink:#efe4d2;--mute:#bba993;--ember:#ff5a36;--moss:#5fb3a1;--gold:#e8c86a;--hex:#b58ae0;--tox:#9bd36a;--card:#f3e9d7;--cardink:#2a1a14}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Alegreya Sans',system-ui,sans-serif;overflow-x:clip}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#3d201a 0%,#1f1311 55%,#110b0a 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:Cinzel,serif;line-height:1.05;margin:0;text-wrap:balance;font-weight:800}
#app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px 14px;padding:8px 14px;flex-wrap:wrap;position:sticky;top:0;background:#140c0bdd;backdrop-filter:blur(6px);border-bottom:1px solid #ffffff14;z-index:5}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;white-space:nowrap}
.stat.hp{color:#ff8a6e}.stat.gd{color:var(--gold)}
.relics{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.rel{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle at 35% 30%,#4a3218,#1d140c);color:var(--gold);font:800 14px Cinzel,serif;display:inline-grid;place-items:center;padding:0;flex:none}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid #ffffff30;background:#2d1b17;font-weight:800}
.btn:hover:not(:disabled){border-color:#ffffff66}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#1a0d09}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:0 12px}
/* title */
.title{display:flex;flex-direction:column;min-height:100vh}
.title .hero{width:100%;height:46vh;min-height:230px;display:block}
.tbody{padding:18px max(5vw,18px) 40px;max-width:720px;margin:0 auto;width:100%}
.title h1{font-size:clamp(40px,10vw,64px)}
.lede{font-size:17px;color:var(--mute);max-width:52ch;margin:12px 0 20px}
.how{margin-top:26px;border-top:1px solid #ffffff1a;padding-top:6px}
.how summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.how li{margin:7px 0;color:var(--mute)}
.emb{animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
/* map */
.mapv{padding:14px 12px 34px}
.maphead{text-align:center}.maphead h2{font-size:30px}.maphead p{color:var(--mute);margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:13px;color:var(--mute);margin:10px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.map{display:block;width:100%;max-width:440px;margin:0 auto;background:radial-gradient(90% 60% at 50% 40%,#2c1814,#1a100e);border-radius:20px;border:1px solid #ffffff12}
.map line{stroke:#ffffff2a;stroke-width:2.5;stroke-dasharray:3 6;stroke-linecap:round}
.map line.on{stroke:var(--gold);stroke-dasharray:none;stroke-width:3}
.node .hit{fill:transparent}.node .c{fill:#2d1b17;stroke:#ffffff45;stroke-width:2}
.node.can{cursor:pointer}.node.can .c{fill:#4e2219;stroke:var(--ember);stroke-width:3;animation:pulse 1.3s ease-in-out infinite}
.node.vis .c{fill:#5a3a2c;stroke:var(--gold)}.node.dim{opacity:.32}
.node.boss .c{fill:#2a1416;stroke:var(--gold);stroke-width:3}
@keyframes pulse{50%{stroke-width:6}}
/* combat stage */
.stage{position:relative;height:clamp(318px,46vh,440px);overflow:hidden;border-bottom:1px solid #ffffff14;isolation:isolate}
.stage>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.stage.quake{animation:quake .4s}
@keyframes quake{15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}50%{transform:translate(-5px,3px)}70%{transform:translate(3px,-2px)}}
.hint{position:absolute;top:10px;left:0;right:0;text-align:center;margin:0;font:800 15px Cinzel,serif;text-shadow:0 2px 8px #000}
.actors{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:0 10px 0 24px}
.foes{display:flex;gap:2px;align-items:flex-end;justify-content:flex-end}
.unit{width:120px;border:0;background:none;padding:2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:inherit}
.unit.big{width:160px}
.spr{display:block;width:114px;height:95px;position:relative}
.unit.big .spr{width:156px;height:130px}
.spr>svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 8px #000b)}
.bob{animation:bob 2.6s ease-in-out infinite}.bob.fly{animation-name:fly}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.02)}}
@keyframes fly{50%{transform:translateY(-10px)}}
.spr.outR{animation:outR .11s ease-in forwards}@keyframes outR{to{transform:translateX(42px)}}
.spr.retR{animation:retR .28s ease-out}@keyframes retR{from{transform:translateX(42px)}}
.spr.outL{animation:outL .11s ease-in forwards}@keyframes outL{to{transform:translateX(-42px)}}
.spr.retL{animation:retL .28s ease-out}@keyframes retL{from{transform:translateX(-42px)}}
.spr.hitR{animation:hitR .34s}@keyframes hitR{0%{filter:brightness(4) saturate(0)}30%{transform:translateX(12px)}100%{filter:none;transform:none}}
.spr.hitL{animation:hitL .34s}@keyframes hitL{0%{filter:brightness(4) saturate(0)}30%{transform:translateX(-12px)}100%{filter:none;transform:none}}
.unit.tgt{cursor:crosshair}
.unit.tgt .spr::after{content:'';position:absolute;left:12%;right:12%;bottom:-3px;height:12px;border-radius:50%;box-shadow:0 0 0 2px var(--ember),0 0 18px var(--ember);animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{opacity:.45}}
.hero.guard .spr::before{content:'';position:absolute;inset:-4px 8px 0;border-radius:50% 50% 42% 42%;background:radial-gradient(closest-side,transparent 62%,#5fb3a150);box-shadow:inset 0 0 0 2px #5fb3a170}
.unit.dying{animation:die .8s forwards;pointer-events:none}
@keyframes die{to{opacity:0;filter:blur(4px) sepia(1) brightness(1.8);transform:translateY(-16px) scale(.88)}}
.unit.dead{visibility:hidden;pointer-events:none}
.info{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;background:#000000a0;border-radius:9px;padding:3px 6px 4px}
.fn{font:800 12.5px Cinzel,serif;text-align:center;line-height:1.1}
.ints{display:flex;gap:4px;min-height:26px}
.it{display:inline-flex;gap:3px;align-items:center;font-weight:800;padding:2px 8px;border-radius:8px;font-size:15px;white-space:nowrap;background:#000a}
.it.a{color:#ff9a80;box-shadow:inset 0 0 0 1.5px #ff5a3699}.it.b{color:#8fe0cf;box-shadow:inset 0 0 0 1.5px #5fb3a199}.it.u{color:var(--gold);box-shadow:inset 0 0 0 1.5px #e8c86a99}.it.d{color:#d2b6f2;box-shadow:inset 0 0 0 1.5px #b58ae099}
.bar{display:block;width:100%;height:9px;border-radius:6px;background:#0009;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#ff7a58,#c8371c);transition:width .3s}
.hpt{font-size:13px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.chips:empty{display:none}
.chip{font-size:13px;font-weight:800;padding:1px 6px;border-radius:7px;background:#0007;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.chip.blk,.chip.b{background:var(--moss);color:#0c201c}.chip.u{background:#e8c86a2e;color:var(--gold)}.chip.d{background:#b58ae02e;color:#d2b6f2}.chip.p{background:#9bd36a2e;color:var(--tox)}
.hand{position:relative;height:204px;margin-top:2px}
.hand .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);margin:0}
.hand .card{position:absolute;top:38px;transform-origin:50% 130%;transform:translateY(var(--y)) rotate(var(--r));transition:transform .18s ease-out}
.hand .card.sel{transform:translateY(-32px) rotate(0) scale(1.07);z-index:40!important;box-shadow:0 0 0 3px var(--gold),0 16px 26px #000d}
@keyframes deal{from{transform:translate(-170px,70px) rotate(-28deg);opacity:0}}
.ctl{display:flex;align-items:center;gap:12px;padding:4px 14px 16px}
.ctl .piles{flex:1;line-height:1.3}
.orb{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb391,var(--ember) 55%,#7a1d0c);color:#1a0d09;display:grid;place-items:center;align-content:center;flex:none;box-shadow:0 0 22px #ff5a3677,inset 0 -4px 8px #0005;font-family:Cinzel,serif;line-height:1}
.orb b{font-size:25px}.orb small{font-size:12px;font-weight:800}
.piles{font-size:14px;color:var(--mute)}
#aim{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35;display:none;overflow:visible;color:var(--ember);filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 2px 2px #000)}
#aim g path{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}#aim g path.head{fill:currentColor;stroke-width:2}
.unit.aimed .spr::after{content:'';position:absolute;left:8%;right:8%;bottom:-4px;height:14px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 0 26px var(--gold);animation:none}
.unit.aimed .info{box-shadow:0 0 0 2px var(--gold)}
.hand,.stage{-webkit-user-select:none;user-select:none}.hand .card{touch-action:none}
.hand .card.lifted{visibility:hidden}
.card.dragcard{position:fixed;margin:0;z-index:46;pointer-events:none;transition:box-shadow .15s;transform-origin:50% 50%}
.card.dragcard.ready{box-shadow:0 0 0 3px var(--gold),0 0 30px #e8c86aaa,0 18px 30px #000c!important}
.stage{transition:box-shadow .2s}.stage.drop{box-shadow:inset 0 0 0 2px #e8c86a77,inset 0 -40px 80px #e8c86a26}
.hero{width:150px}.hero .spr{width:150px;height:226px}
.rig{position:absolute;left:-22%;top:0;width:144%;height:100%;filter:drop-shadow(0 8px 10px #000c)}
.rigimg{position:absolute;bottom:0;left:50%;height:96%;transform:translateX(-50%);filter:drop-shadow(0 8px 10px #000c)}
.gshadow{position:absolute;left:14%;right:10%;bottom:-3px;height:10px;border-radius:50%;background:radial-gradient(closest-side,#000a,transparent)}
.card.ghost{position:fixed;margin:0;z-index:45;pointer-events:none;transition:none}
.spark{position:fixed;width:7px;height:7px;margin:-3px;border-radius:50%;background:#ffb36b;box-shadow:0 0 10px var(--ember);pointer-events:none;z-index:45}
.banner{position:fixed;left:0;right:0;top:30%;z-index:40;text-align:center;pointer-events:none;animation:ban 2.1s forwards;background:linear-gradient(90deg,transparent,#000d 18%,#000d 82%,transparent);padding:16px 0 18px}
.banner small{display:block;font:800 14px Cinzel,serif;color:var(--ember);letter-spacing:.18em;margin-bottom:4px}
.banner b{font:800 clamp(30px,8vw,54px) Cinzel,serif;color:var(--gold);text-shadow:0 0 24px #e8c86a55}
@keyframes ban{0%{opacity:0;transform:scaleY(.15)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .6s ease-in-out infinite alternate}
/* cards */
.card{position:relative;flex:none;width:106px;height:152px;border-radius:11px;border:0;padding:0;background:var(--card);color:var(--cardink);box-shadow:0 8px 16px #000a,inset 0 0 0 3px var(--tc);display:flex;flex-direction:column;text-align:center;transition:transform .15s;scroll-snap-align:center}
.card.t-atk{--tc:#c4452c}.card.t-skl{--tc:#3c8b7c}.card.t-pow{--tc:#c4962a}.card.t-curse{--tc:#5d4b62;background:#d6cbd6}
.card .cost{position:absolute;top:-8px;left:-8px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb391,var(--ember) 60%,#9a2810);color:#1a0d09;font:800 16px Cinzel,serif;display:grid;place-items:center;border:2px solid #1a0d09}
.card .nm{font:800 12.5px/1.1 Cinzel,serif;padding:11px 8px 3px;min-height:34px;display:grid;place-items:center}
.card.up .nm{color:#2f7d3e}
.card .art{height:40px;margin:0 9px;border-radius:7px;background:linear-gradient(160deg,var(--tc),#00000066),var(--tc);display:grid;place-items:center}
.card .ds{font-size:13px;line-height:1.18;padding:5px 7px;flex:1;display:grid;place-items:center}
.card .ty{font-size:11px;font-weight:800;opacity:.6;padding-bottom:5px;letter-spacing:.02em}
@media(hover:hover){.row .card:hover:not(:disabled):not(.no),.grid .card:hover{transform:translateY(-6px)}.hand .card:hover:not(.no){transform:translateY(-24px) rotate(0) scale(1.05);z-index:39!important}}
.card.r2{box-shadow:0 8px 16px #000a,inset 0 0 0 3px var(--tc),0 0 0 2px #cfd8de}
.card.r3{box-shadow:0 8px 16px #000a,inset 0 0 0 3px var(--tc),0 0 0 2px var(--gold),0 0 16px #e8c86a77}
.card.r3::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 38%,#fff8 50%,transparent 62%) no-repeat;background-size:260% 100%;animation:shine 3.4s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:140% 0}to{background-position:-140% 0}}
.card.no{filter:saturate(.35) brightness(.72)}
/* panels */
.panel{max-width:680px;margin:0 auto;width:100%;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.panel h2{font-size:clamp(30px,7vw,42px)}.panel h3{font-size:20px}
.sub{color:var(--mute);font-size:17px;margin:0;max-width:52ch}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.row.l{justify-content:flex-start}
.ware{display:flex;flex-direction:column;align-items:center;gap:8px}
.price{font-weight:800;color:var(--gold);white-space:nowrap}.price.poor{color:#ff8a6e}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px}
.opt{text-align:left;padding:10px 16px}
.relbtn{display:inline-flex;align-items:center;gap:10px;text-align:left;padding:8px 14px}
.pic{width:min(260px,72%);height:auto;display:block}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.9) scaleX(1.04)}}
.end h1{font-size:clamp(38px,9vw,58px)}
/* overlays */
#modal:empty{display:none}
.modal{position:fixed;inset:0;background:#0b0706ee;z-index:20;overflow:auto;padding:16px 14px 40px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.mhead h2{font-size:24px}
.grid{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;padding-top:22px;max-width:900px;margin:0 auto}
.pop{position:fixed;pointer-events:none;font:800 24px Cinzel,serif;color:#ff7a58;text-shadow:0 2px 0 #000,0 0 8px #000;animation:pop .9s forwards;z-index:50;transform:translateX(-50%)}
.pop.b{color:#8fe0cf}.pop.p{color:var(--tox)}
@keyframes pop{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.shake{animation:sh .32s}
@keyframes sh{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2d1b17;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-weight:700;box-shadow:0 10px 24px #000a}
@media(max-width:600px){.card{width:98px;height:146px}.unit{width:110px}.spr{width:104px;height:87px}.unit.big{width:150px}.unit.big .spr{width:144px;height:120px}.hero{width:128px}.hero .spr{width:128px;height:198px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

  e.block=0;const n=e.int;
  if(n.str){e.st.str=(e.st.str||0)+n.str;fx('#f'+e.i,'+'+n.str+' Str','')}
  if(n.b){e.block+=n.b;fx('#f'+e.i,'+'+n.b+' Block','b')}
  if(n.a)for(let h=0;h<(n.x||1);h++){if(!RM){fx('#f'+e.i+' .spr','','','outL');render();await sleep(110)}hitMe(e,n.a);render();await sleep(300);if(G.hp<=0)break}

  dec(e.st);e.t++;e.int=EN[e.k].ai(e.t);render();await sleep(300);

 m[F-2].forEach(n=>n.next=[0]);m.push([{t:'boss',next:[],jx:0,jy:0}]);return m}

 ${EV.done?`<button class="btn pri" data-a="map">Continue</button>`:`<div class="opts">${e.o.map((o,i)=>`<button class="btn opt" data-a="evo" data-v="${i}" ${o.ok&&!o.ok()?'disabled':''}>${o.l}</button>`).join('')}</div>`}</div>`}
function endV(){const w=screen=='win';return `<div class="panel end"><svg class="pic" viewBox="0 0 200 120" aria-hidden="true">${w?`<g transform="translate(100 64) scale(4.2)">${NI.boss}</g>`:`<g transform="translate(100 62) scale(4.2)">${NI.elite}</g>`}</svg><h1>${w?'The King falls':'Your climb ends'}</h1><p class="sub">${w?`You toppled the Hollow King with a deck of ${G.deck.length} cards and ${G.relics.length} relics.`:`You fell on floor ${G.floor} of 13 with ${G.deck.length} cards in your deck.`}</p><button class="btn pri" data-a="new">Start a new run</button></div>`}
const VIEWS={map:mapV,combat:combatV,reward:rewardV,shop:shopV,rest:restV,event:eventV,dead:endV,win:endV};
function render(){$('#app').innerHTML=screen=='title'?titleV():topV()+VIEWS[screen]();
 if(screen=='map'){const n=$('.node.can');if(n)try{n.scrollIntoView({block:'center'})}catch(e){}}else if(screen!='combat')window.scrollTo(0,0);
 if(screen=='combat'){const hs=$('#hero .spr');if(hs)rigMount(hs)}
 flush();if(screen=='combat'&&C&&C.sel>=0&&!aimOn){aimOn=true;requestAnimationFrame(aimTick)}}
function openPick(title,cards,cb){const list=cb?cards:[...cards].sort((a,b)=>K[a.id].t.localeCompare(K[b.id].t)||K[a.id].n.localeCompare(K[b.id].n));MD={cards:list,cb};
 $('#modal').innerHTML=`<div class="modal" role="dialog" aria-label="${title}"><div class="mhead"><h2>${title}</h2><button class="btn" data-a="mclose">${cb?'Cancel':'Close'}</button></div><div class="grid">${list.map((c,i)=>cardV(c,cb?`data-a="mpick" data-v="${i}"`:'')).join('')||'<p class="sub">No cards to choose.</p>'}</div></div>`}
function closeModal(){MD=null;$('#modal').innerHTML=''}

/* ---------- input ---------- */
const A={
new:newRun,
cont:()=>{G=load();if(!G)return;uid=Math.max(0,...G.deck.map(c=>c.u||0))+1;goMap()},
deck:()=>openPick('Your deck ('+G.deck.length+' cards)',G.deck,null),

buyrel:()=>{const r=SH.relic;if(!r||r.sold)return;if(G.gold<r.p)return toast('Not enough gold.');G.gold-=r.p;r.sold=1;gainRelic(r.k);render()},
remove:()=>{if(SH.removed)return;if(G.gold<75)return toast('Not enough gold.');openPick('Remove a card (75 gold)',G.deck,c=>{G.gold-=75;SH.removed=1;G.deck.splice(G.deck.indexOf(c),1);toast(name(c)+' removed.');render()})},
rheal:()=>{if(RS.done)return;const n=Math.round(G.maxHp*.3),b=G.hp;heal(n);RS.done=1;RS.msg='You rest by the fire and recover '+(G.hp-b)+' HP.';render()},
rsmith:()=>{if(RS.done)return;if(!upgradable().length)return toast('Every card is already upgraded.');openPick('Upgrade a card',upgradable(),c=>{c.up=1;RS.done=1;RS.msg='You hammer '+name(c)+' into shape.';render()})},
evo:v=>{if(EV.done)return;const o=EV.e.o[+v];if(o.ok&&!o.ok())return;const m=o.f();if(m!=null){EV.msg=m;EV.done=1}render()},
mpick:v=>{const c=MD.cards[+v],cb=MD.cb;closeModal();if(cb)cb(c)},
mclose:closeModal};
document.addEventListener('click',e=>{if(performance.now()-ignoreClick<350)return;const b=e.target.closest('[data-a]');if(!b&&C&&C.sel>=0&&screen=='combat'&&e.target.closest('.stage')){C.sel=-1;return render()}if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v)});
document.addEventListener('keydown',e=>{if(MD&&e.key=='Escape')return closeModal();if(screen!='combat'||!C||MD)return;
 if(e.key>='1'&&e.key<='9')tapCard(+e.key-1,true);else if(e.key=='e'||e.key=='E')endTurn();else if(e.key=='Escape'&&C.sel>=0){C.sel=-1;render()}});
/* ---------- hero rig: painted art on a deforming WebGL mesh ---------- */
const RIG={cv:null,gl:null,img:{},wt:{},tex:{},buf:{},pose:'idle',until:0,whip:0,flash:0,loop:false,fail:false,last:0};
const PIMG={idle:'assets/hero_idle.webp',attack:'assets/hero_attack.webp',cast:'assets/hero_cast2.webp',power:'assets/hero_cast.webp',hurt:'assets/hero_hurt.webp'};
const GX=20,GY=30;
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
function rigWeights(im,k){const c=document.createElement('canvas'),W=c.width=Math.round(im.width/2),H=c.height=Math.round(im.height/2),x=c.getContext('2d');x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
 let w=new Float32Array(GX*GY*2);
 for(let j=0;j<GY;j++)for(let i=0;i<GX;i++){const u=i/(GX-1),v=j/(GY-1);let cape=0,hair=0,n=0;
  for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const px=Math.min(W-1,Math.max(0,Math.round(u*(W-1)+a*W/GX/4))),py=Math.min(H-1,Math.max(0,Math.round(v*(H-1)+b*H/GY/4))),o=(py*W+px)*4;if(d[o+3]<100)continue;const r=d[o],g=d[o+1],bl=d[o+2];n++;
   if(r>55&&r>g*1.5&&r>bl*1.1)cape++;const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);if(mn>140&&mx-mn<40)hair++}
  const hm=k=='idle'?(v<.2||(u>.56&&u<.86&&v<.34)):v<.22;
  w[(j*GX+i)*2]=n?cape/n*sm(.2,.6,v)*(1-sm(.8,.95,v)):0;w[(j*GX+i)*2+1]=n&&hm?Math.min(1,hair/n*1.6):0}
 for(let p=0;p<2;p++){const o=new Float32Array(w.length);for(let j=0;j<GY;j++)for(let i=0;i<GX;i++)for(let ch=0;ch<2;ch++){let s=0,c=0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const ii=i+a,jj=j+b;if(ii<0||jj<0||ii>=GX||jj>=GY)continue;s+=w[(jj*GX+ii)*2+ch];c++}o[(j*GX+i)*2+ch]=s/c}w=o}
 return w}
function rigLoad(){for(const k in PIMG){const im=new Image();im.onload=()=>{RIG.img[k]=im;try{RIG.wt[k]=rigWeights(im,k)}catch(e){RIG.wt[k]=new Float32Array(GX*GY*2)}};im.src=PIMG[k]}}
const VS=`attribute vec2 a_uv;attribute vec2 a_w;uniform float u_t,u_whip;uniform vec2 u_sc,u_off;varying vec2 v_uv;
void main(){vec2 p=a_uv;float t=u_t;float b=.5+.5*sin(t*2.1);float up=clamp((.56-p.y)/.56,0.,1.);
p.y-=up*.013*b;p.x+=up*up*.006*sin(t*1.05);
float amp=.016+u_whip*.05;p.x+=a_w.x*amp*sin(t*1.7+p.y*5.+p.x*2.);p.y+=a_w.x*amp*.35*cos(t*1.9+p.x*4.);
p.x+=a_w.y*(.007+u_whip*.02)*sin(t*2.6+p.y*9.);p.y+=a_w.y*.004*cos(t*2.3+p.x*7.);
gl_Position=vec4(vec2(p.x-.5,1.-p.y)*u_sc+u_off,0.,1.);v_uv=a_uv;}`;
const FS=`precision mediump float;varying vec2 v_uv;uniform sampler2D u_tex;uniform float u_tf,u_flash;
void main(){vec4 c=texture2D(u_tex,v_uv);float pur=smoothstep(.06,.3,c.b-max(c.g,c.r*.85));c.rgb*=1.+pur*(.22+.22*sin(u_tf*4.));c.rgb+=u_flash*c.a*.9;gl_FragColor=c;}`;
function rigInit(){const cv=document.createElement('canvas');cv.className='rig';RIG.cv=cv;let gl=null;try{gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:true})}catch(e){}
 if(!gl){RIG.fail=true;return}
 const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o};
 try{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);gl.useProgram(p);RIG.p=p}catch(e){RIG.fail=true;return}
 const uv=new Float32Array(GX*GY*2);for(let j=0;j<GY;j++)for(let i=0;i<GX;i++){uv[(j*GX+i)*2]=i/(GX-1);uv[(j*GX+i)*2+1]=j/(GY-1)}
 const idx=[];for(let j=0;j<GY-1;j++)for(let i=0;i<GX-1;i++){const a=j*GX+i;idx.push(a,a+1,a+GX,a+1,a+GX+1,a+GX)}
 RIG.uvb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,RIG.uvb);gl.bufferData(gl.ARRAY_BUFFER,uv,gl.STATIC_DRAW);
 RIG.ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,RIG.ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);RIG.n=idx.length;
 RIG.L={uv:gl.getAttribLocation(RIG.p,'a_uv'),w:gl.getAttribLocation(RIG.p,'a_w'),t:gl.getUniformLocation(RIG.p,'u_t'),tf:gl.getUniformLocation(RIG.p,'u_tf'),whip:gl.getUniformLocation(RIG.p,'u_whip'),sc:gl.getUniformLocation(RIG.p,'u_sc'),off:gl.getUniformLocation(RIG.p,'u_off'),fl:gl.getUniformLocation(RIG.p,'u_flash')};
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);RIG.gl=gl;
 cv.addEventListener('webglcontextlost',e=>{e.preventDefault();RIG.fail=true})}
function rigTex(k,h){const gl=RIG.gl,im=RIG.img[k],t=RIG.tex[k];if(t&&t.h==h)return t.t;if(t)gl.deleteTexture(t.t);
 const c=document.createElement('canvas');c.height=Math.min(im.height,h);c.width=Math.round(im.width*c.height/im.height);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);
 const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
 [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE));
 RIG.tex[k]={t:tx,h};return tx}
function rigPose(k,ms){if(!RIG.img[k])return;RIG.pose=k;RIG.until=performance.now()+ms;RIG.whip=1}
function muzzle(){if(RM||!RIG.cv||!RIG.cv.isConnected||!RIG.img.attack)return;const r=RIG.cv.getBoundingClientRect(),im=RIG.img.attack,fh=r.height*.96,fw=fh*im.width/im.height,x=r.left+r.width/2+(.9-.5)*fw,y=r.bottom-r.height*.0075-fh*(1-.17);
 for(let k=0;k<14;k++){const s=document.createElement('div');s.className='spark';s.style.background=k%3?'#c9a2ff':'#fff';s.style.boxShadow='0 0 10px #a46bff';s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);const a=(Math.random()-.5)*1.1,d=30+R(70);s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:350+R(300),easing:'ease-out'}).onfinish=()=>s.remove()}}
function rigMount(spr){if(!RIG.cv&&!RIG.fail)rigInit();if(RIG.fail||!RIG.cv){if(!spr.querySelector('.rigimg'))spr.insertAdjacentHTML('beforeend',`<img class="rigimg" src="${PIMG.idle}" alt="">`);return}
 spr.appendChild(RIG.cv);if(!RIG.loop){RIG.loop=true;RIG.last=performance.now();requestAnimationFrame(rigTick)}}
function rigTick(now){const cv=RIG.cv,gl=RIG.gl;if(screen!='combat'||!cv.isConnected||RIG.fail){RIG.loop=false;return}requestAnimationFrame(rigTick);
 const dt=Math.min(.05,(now-RIG.last)/1000);RIG.last=now;RIG.whip*=Math.pow(.12,dt);RIG.flash*=Math.pow(.004,dt);
 const dpr=Math.min(2,devicePixelRatio||1),W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);if(!W||!H)return;if(cv.width!=W||cv.height!=H){cv.width=W;cv.height=H}
 if(now>RIG.until)RIG.pose='idle';let k=RIG.pose;if(!RIG.img[k]||!RIG.wt[k])k='idle';if(!RIG.img[k]||!RIG.wt[k])return;
 if(!RIG.buf[k]){RIG.buf[k]=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,RIG.buf[k]);gl.bufferData(gl.ARRAY_BUFFER,RIG.wt[k],gl.STATIC_DRAW)}
 const im=RIG.img[k],fh=1.92,fw=fh*(im.width/im.height)*(H/W);
 gl.viewport(0,0,W,H);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,rigTex(k,Math.ceil(H*.98)));
 gl.bindBuffer(gl.ARRAY_BUFFER,RIG.uvb);gl.enableVertexAttribArray(RIG.L.uv);gl.vertexAttribPointer(RIG.L.uv,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,RIG.buf[k]);gl.enableVertexAttribArray(RIG.L.w);gl.vertexAttribPointer(RIG.L.w,2,gl.FLOAT,false,0,0);
 gl.uniform1f(RIG.L.t,RM?0:now/1000);gl.uniform1f(RIG.L.tf,RM?0:(now/1000)%62.83);gl.uniform1f(RIG.L.whip,RM?0:RIG.whip);gl.uniform1f(RIG.L.fl,RIG.flash);gl.uniform2f(RIG.L.sc,fw,fh);gl.uniform2f(RIG.L.off,0,-.985);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,RIG.ib);gl.drawElements(gl.TRIANGLES,RIG.n,gl.UNSIGNED_SHORT,0)}
rigLoad();

/* ---------- targeting arrow ---------- */
let AP={x:0,y:0,moved:false},aimOn=false,drag=null,ignoreClick=0;
const liveFoe='.unit[data-a=foe]:not(.dead):not(.dying)';
function aimTick(){const svg=$('#aim'),on=screen=='combat'&&C&&C.sel>=0&&!C.busy&&!C.lock;
 if(!on){svg.style.display='none';document.querySelectorAll('.unit.aimed').forEach(u=>u.classList.remove('aimed'));aimOn=false;return}
 const card=$('.hand .card.sel');if(!card){svg.style.display='none';return requestAnimationFrame(aimTick)}
 svg.style.display='block';const cr=card.getBoundingClientRect(),sx=cr.left+cr.width/2,sy=cr.top+10;
 let over=null;if(AP.moved){const el=document.elementFromPoint(AP.x,AP.y);over=el&&el.closest(liveFoe)}else over=$(liveFoe);
 document.querySelectorAll('.unit.aimed').forEach(u=>{if(u!==over)u.classList.remove('aimed')});if(over)over.classList.add('aimed');
 let ex=AP.x,ey=AP.y;if(over){const r=over.querySelector('.spr').getBoundingClientRect();ex=r.left+r.width/2;ey=r.top+r.height*.45}
 const qx=sx+(ex-sx)*.1,qy=Math.min(sy,ey)-Math.max(70,Math.abs(ex-sx)*.4);
 const P=$('#aimP');P.setAttribute('d',`M${sx} ${sy}Q${qx} ${qy} ${ex} ${ey}`);const L=P.getTotalLength(),gap=24,ph=RM?0:(performance.now()/24)%gap;let h='';
 for(let d=ph;d<L-30;d+=gap){const p=P.getPointAtLength(d),q=P.getPointAtLength(Math.min(L,d+1)),a=Math.atan2(q.y-p.y,q.x-p.x)*57.2958,sc=.55+.55*d/L;h+=`<path d="M-5-6L3 0L-5 6" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${sc.toFixed(2)})"/>`}
 if(L>4){const p=P.getPointAtLength(L),q=P.getPointAtLength(L-3),a=Math.atan2(p.y-q.y,p.x-q.x)*57.2958;h+=`<path class="head" d="M-15-13L7 0L-15 13L-9 0Z" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)})${over?' scale(1.2)':''}"/>`}
 svg.style.color=over?'var(--gold)':'var(--ember)';$('#aimG').innerHTML=h;requestAnimationFrame(aimTick)}
document.addEventListener('pointerdown',e=>{AP.x=e.clientX;AP.y=e.clientY;const b=e.target.closest('.hand .card[data-a=card]');if(!b||!C||C.busy||C.lock)return;const i=+b.dataset.v,c=C.hand[i];if(!c||cost(c)<0||cost(c)>C.energy)return;drag={i,x:e.clientX,y:e.clientY,active:false,tg:!!K[c.id].tg,el:b,lx:e.clientX,tilt:0}});
function dragMove(){const d=drag;if(!d||!d.g)return;const vx=AP.x-d.lx;d.lx=AP.x;d.tilt=Math.max(-14,Math.min(14,d.tilt*.8+vx*.9));d.g.style.left=(AP.x-d.ox)+'px';d.g.style.top=(AP.y-d.oy)+'px';d.g.style.transform=`scale(1.08) rotate(${d.tilt.toFixed(1)}deg)`;
 const h=$('.hand'),ready=!!h&&AP.y<h.getBoundingClientRect().top+16;d.ready=ready;d.g.classList.toggle('ready',ready);const st=$('.stage');if(st)st.classList.toggle('drop',ready);const hi=$('.hint');if(hi)hi.textContent=ready?'Release to play':'Drag up to play'}
function endFree(){const st=$('.stage');if(st)st.classList.remove('drop')}
document.addEventListener('pointermove',e=>{AP.x=e.clientX;AP.y=e.clientY;if(C&&C.sel>=0)AP.moved=true;
 if(drag&&!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12){drag.active=true;if(!C||C.busy||C.lock){drag=null;return}
  if(drag.tg){C.sel=drag.i;AP.moved=true;render()}
  else{if(C.sel>=0){C.sel=-1;render();drag.el=$(`.hand .card[data-v="${drag.i}"]`)}const b=drag.el,r=b.getBoundingClientRect(),g=b.cloneNode(true);g.removeAttribute('data-a');g.classList.add('dragcard');g.classList.remove('sel');g.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;animation:none`;drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;document.body.appendChild(g);drag.g=g;b.classList.add('lifted')}}
 if(drag&&drag.g)dragMove()},{passive:true});
document.addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d||!d.active||!C)return;ignoreClick=performance.now();
 if(!d.tg){endFree();const g=d.g;if(!g)return;
  if(d.ready&&!C.busy&&!C.lock&&C.hand[d.i]&&cost(C.hand[d.i])<=C.energy){play(d.i,null,g);g.remove();return}
  const hint=$('.hint');if(hint)hint.textContent='Your turn '+C.turn;const r=d.el.getBoundingClientRect(),gr=g.getBoundingClientRect();
  const fin=()=>{g.remove();d.el.classList.remove('lifted')};if(RM)return fin();
  g.animate([{transform:g.style.transform},{transform:`translate(${r.left-gr.left}px,${r.top-gr.top}px) scale(1) rotate(0)`}],{duration:180,easing:'ease-out'}).onfinish=fin;return}
 if(C.busy||C.lock)return;const el=document.elementFromPoint(e.clientX,e.clientY),u=el&&el.closest(liveFoe);if(u&&C.sel>=0){const f=C.foes[+u.dataset.v];if(f&&f.hp>0)return play(C.sel,f)}C.sel=-1;AP.moved=false;render()});
document.addEventListener('pointercancel',()=>{if(drag&&drag.g){drag.g.remove();drag.el.classList.remove('lifted');endFree()}drag=null});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(screen=='combat'&&C&&!C.busy&&!C.lock)render()},150)});
render();
})();
