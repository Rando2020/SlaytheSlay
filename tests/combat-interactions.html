<!doctype html>
<meta charset="utf-8">
<title>Hollow Ascent interaction tests</title>
<h1>Combat interaction tests</h1>
<pre id="results" role="status">Starting combat lab...</pre>
<iframe title="Game under test" width="960" height="600"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const output = document.querySelector('#results');
const lines = [];
function check(condition, label) {
  if (!condition) throw Error(label);
  lines.push('PASS ' + label);
  output.textContent = lines.join('\n');
}
async function launch(hero, encounter, oath = '') {
  const params = new URLSearchParams({dev:'combat', hero, encounter, oath, floor:'1'});
  const url = new URL('../index.html?' + params, location.href).href;
  frame.src = url;
  const deadline = Date.now() + 15000;
  while (frame.contentWindow.location.href !== url || !frame.contentWindow.hollowLab) {
    if (Date.now() > deadline) throw Error('Lab initialization timed out');
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  return frame.contentWindow.hollowLab;
}
async function runAether() {
  const lab = await launch('aether', 'tick,tick');
  let state = lab.inspect();
  const act = async predicate => {
    const index = state.actions.findIndex(predicate);
    if (index < 0) throw Error('Expected action missing on ' + state.screen);
    state = await lab.act(state.revision, index);
  };
  const initial = state.revision;
  await act(a => a.action === 'deck');
  check(state.dialog && state.actions.every(a => a.action === 'mclose'), 'Deck picker restricts available actions');
  let rejected = false;
  try { await lab.act(initial, 0); } catch { rejected = true; }
  check(rejected, 'Stale commands are rejected');
  await act(a => a.action === 'mclose');
  const target = 1;
  let struck = false, blocked = false;
  for (let step = 0; step < 60 && state.screen === 'combat'; step++) {
    const before = state;
    const foe = state.enemies[target].hp > 0 ? target : 0;
    const attack = a => a.type === 'play' && a.target === foe;
    const defend = a => a.type === 'play' && state.hand.find(c => c.uid === a.uid)?.id === 'defend';
    if (!blocked && state.actions.some(defend)) {
      await act(defend);
      check(state.block > before.block && state.energy === before.energy - 1, 'Defend spends energy and gains block');
      blocked = true;
    } else if (state.actions.some(attack)) {
      await act(attack);
      if (!struck) {
        check(state.enemies[foe].hp + state.enemies[foe].block < before.enemies[foe].hp + before.enemies[foe].block
          && state.enemies[1-foe].hp === before.enemies[1-foe].hp, 'Attack resolves on the chosen enemy');
        struck = true;
      }
    } else {
      await act(a => a.type === 'endTurn');
      if (state.screen === 'combat') check(state.turn === before.turn + 1, 'Enemy turn resolves and advances the turn');
    }
  }
  check(struck && blocked && state.screen === 'reward', 'Combat resolves to rewards');
  const size = state.deck.length;
  await act(a => a.action === 'inspectreward');
  check(state.deck.length === size && state.dialog, 'Inspecting a reward leaves the deck unchanged');
  await act(a => a.action === 'rcard');
  check(state.deck.length === size + 1 && !state.actions.some(a => a.action === 'inspectreward'), 'Reward adds one card and cannot be taken twice');
  await act(a => a.action === 'map');
  check(state.screen === 'map', 'Reward returns to the map');
}
async function runOath(oath, form) {
  const lab = await launch('oath', 'warden', oath);
  const label = oath || 'Unsworn';
  let state = lab.inspect();
  check(state.hero === 'oath' && state.oaths.join(',') === oath, label + ': correct hero and oath loaded');
  const card = state.deck.find(c => c.id === 'judgment');
  const playJudgment = action => action.type === 'play' && action.uid === card.u;
  const endTurn = action => action.type === 'endTurn';
  async function act(predicate) {
    const index = state.actions.findIndex(predicate);
    if (index === -1) throw Error(label + ': expected action missing on turn ' + state.turn);
    state = await lab.act(state.revision, index);
  }
  check(state.relics.includes('unbroken') && state.block === 5, label + ': Unbroken Vow grants 5 opening Block');
  // Mora adds two Burdens, so Judgment may be in the third five-card draw.
  while (!state.actions.some(playJudgment) && state.turn < 3) await act(endTurn);
  await act(playJudgment);
  const deckCard = state.deck.find(c => c.u === card.u);
  if (!oath) {
    check(!deckCard.tier && state.discard.some(c => c.u === card.u), 'Unsworn Judgment stays Mortal and enters discard');
    return;
  }
  const copiesInSanctum = () => state.sanctums[oath].filter(c => c.u === card.u).length;
  check(deckCard.tier === 1 && deckCard.g === oath && copiesInSanctum() === 1 &&
    !state.discard.some(c => c.u === card.u), label + ': Judgment sanctifies in the deck and enters its Sanctum');
  await act(endTurn);
  const drawn = state.hand.filter(c => c.uid === card.u);
  check(state.block === 0, label + ': opening relic Block does not refresh');
  check(state.hand.length === 5 && drawn.length === 1 && drawn[0].name === form && drawn[0].god === oath && drawn[0].tier === 1 &&
    state.hand.filter(c => c.tier === 0).length === 4 && copiesInSanctum() === 0,
    label + ': Divine Draw deals four ordinary cards and ' + form);
  const before = state.enemies[0].hp + state.enemies[0].block;
  await act(playJudgment);
  check(state.enemies[0].hp + state.enemies[0].block < before && copiesInSanctum() === 1 &&
    !state.hand.some(c => c.uid === card.u) && !state.discard.some(c => c.u === card.u),
    label + ': ' + form + ' hits the target and returns to its Sanctum');
}
async function run() {
  await runAether();
  for (const [oath, form] of Object.entries({
    '':'Judgment', aurel:'Divine Verdict', varran:'Execution', orun:'Weight of Stone', mora:'Final Sentence'
  })) await runOath(oath, form);
}
run().then(() => output.dataset.result = 'pass').catch(error => {
  output.textContent += '\nFAIL ' + error.message;
  output.dataset.result = 'fail';
});
</script>
