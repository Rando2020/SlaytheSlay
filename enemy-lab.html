<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enemy Animation Lab | Hollow Ascent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191920;color:#e8e1d3;font:15px system-ui}main{max-width:1180px;margin:auto;padding:24px}header,footer,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#edc888}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(24px,4vw,42px);margin:12px 0 22px}h2{font-size:26px;margin:0}section{display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,290px);border:1px solid #57504b;background:#24242a}.scene{min-height:380px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 45% 55%,#504853 0%,#302f39 55%,#202129 100%)}.scene svg{width:78%;height:430px;overflow:visible}.caption{position:absolute;left:20px;bottom:16px;color:#ddd1be}.panel{padding:20px;display:grid;gap:12px}label{display:grid;gap:5px;color:#c9c3b9}select,button{background:#35343b;color:#f3e7d3;border:1px solid #686059;border-radius:4px;padding:8px;font:inherit}button{cursor:pointer}input{accent-color:#d4ae78;width:100%}footer{flex-wrap:wrap;margin:16px 0}footer label{flex:1;min-width:120px}small{color:#cec4b7}.joint{fill:#ffd893;stroke:#47372c;stroke-width:1.5}output{font-variant-numeric:tabular-nums}@media(max-width:700px){main{padding:12px}section{grid-template-columns:1fr}.scene{min-height:300px}.scene svg{height:300px}.panel{grid-template-columns:1fr 1fr}.caption{font-size:18px}}
</style>
<main><header><h1>Enemy Animation Lab</h1><a href="index.html">Return to game</a></header>
<section><div class="scene"><svg id="rig" role="img" aria-label="Assembled enemy"></svg><h2 class="caption" id="nameplate"></h2></div>
<div class="panel"><label>Enemy<select id="enemy"></select></label><label>Animation<select id="state"></select></label>
<label>Bone<select id="bone"></select></label><label>Rest rotation <output id="degrees"></output><input id="angle" type="range" min="-45" max="45" step=".5"></label>
<label>Secondary motion<input id="gain" type="range" min="0" max="2" value="1" step=".05"></label>
<label>Playback speed<select id="speed"><option>.25</option><option>.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label>
<button id="joints" aria-pressed="false">Show pivots</button><button id="reset">Reset rig</button><button id="save">Export rig JSON</button></div></section>
<footer><button id="play">Pause</button><label>Animation timeline<input id="timeline" type="range" min="0" max="1000" value="0"></label><output id="clock"></output></footer><small id="status" role="status"></small></main>
<script src="assets/rigs/registry.js"></script><script src="assets/rigs/player.js"></script><script src="assets/rigs/lab.js"></script></html>
